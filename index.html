<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISTRICT WEATHER // SYSTEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Анимированный Canvas задник -->
  <canvas id="weather-canvas"></canvas>

  <!-- Главный контейнер -->
  <main class="app-wrapper">

    <!-- Шапка: Поиск -->
    <header class="header">
      <div class="search-group">
        <button id="geo-btn" class="btn btn-icon" title="Мое местоположение"><span class="icon">📍</span></button>
        <input type="text" id="city-input" class="search-input" placeholder="Введите название города..." autocomplete="off">
        <button id="search-btn" class="btn btn-primary"><span>🔎</span></button>
      </div>
    </header>

    <!-- Главная карточка -->
    <section class="current-weather">
      <div class="main-info">
        <h1 id="city-title" class="city-name">Загрузка...</h1>
        <p id="weather-condition" class="condition-desc">Опрашиваем спутники...</p>
        <div class="temp-display">
          <span id="current-temp" class="temp-val">--</span>
          <span class="temp-unit">°C</span>
        </div>
      </div>

      <!-- Сетка метрик -->
      <div class="metrics-grid">
        <article class="metric-card">
          <span class="metric-label">Ощущается как</span>
          <span id="feels-like" class="metric-value">--°C</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Ветер</span>
          <span id="wind-speed" class="metric-value">-- м/с</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Влажность</span>
          <span id="humidity" class="metric-value">--%</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Давление</span>
          <span id="pressure" class="metric-value">-- мм рт. ст.</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">УФ-Индекс</span>
          <span id="uv-index" class="metric-value">--</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">Видимость</span>
          <span id="visibility" class="metric-value">-- км</span>
        </article>
      </div>
    </section>

    <!-- Почасовой прогноз -->
    <section class="forecast-section">
      <h2 class="section-title">Почасовой прогноз (24 Часа)</h2>
      <div id="hourly-container" class="hourly-track"></div>
    </section>

    <!-- Прогноз на неделю -->
    <section class="forecast-section">
      <h2 class="section-title">Прогноз на неделю (7 Дней)</h2>
      <div id="weekly-container" class="weekly-list"></div>
    </section>

    <!-- Статус -->
    <footer class="app-footer">
      <span class="status-indicator online"></span>
      <span id="status-text">Система готова. Ожидание ввода...</span>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
            </html>
